[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-aging"
version = "4.0.0-dev"
description = "铁衰老 × CIRI × GAT-HGT 药物预测系统"
readme = "DEPLOY.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jy-Mentor"},
]
keywords = ["ferroptosis", "senescence", "CIRI", "GNN", "drug-repurposing", "TCM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "torch>=2.0",
    "torch-geometric>=2.3",
    "torch-scatter>=2.1",
    "torch-sparse>=0.6",
    "networkx>=3.0",
    "rdkit>=2023.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "requests>=2.31",
    "tqdm>=4.65",
    "shap>=0.42",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",
    "pymongo>=4.6",
    "redis>=5.0",
    "pydantic>=2.5",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "celery>=5.3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "pre-commit",
]

[project.scripts]
iron-aging = "iron_aging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "W", "F", "I", "C901"]
ignore = ["E402"]

[tool.ruff.mccabe]
max-complexity = 55

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=iron_aging --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
