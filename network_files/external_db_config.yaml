# ============================================================
# 外部数据库查询配置文件
# ============================================================
# 所有外部数据库查询所需的标识符/关键词, 无硬编码。
# 修改此文件即可调整查询目标, 无需修改代码。
#
# 数据来源:
#   - PubChem CIDs: 公开可查 (https://pubchem.ncbi.nlm.nih.gov/)
#   - STITCH 化学ID: 基于PubChem CID映射
#   - DisGeNET 疾病关键词: 用于匹配 curated gene-disease associations
#   - KEGG 通路ID: 公开可查 (https://www.kegg.jp/)
#   - PanglaoDB 细胞类型: 公开可查 (https://panglaodb.se/)
# ============================================================

# ---- 化合物 PubChem CID (公开信息, 可验证) ----
compounds:
  BCP: 5281515       # beta-Caryophyllene
  VC: 54670067       # Ascorbic acid (Vitamin C)
  Fer-1: 4063092     # Ferrostatin-1
  DFO: 2973          # Deferoxamine
  Lip-1: 42608917    # Liproxstatin-1
  Erastin: 11294402  # Erastin
  RSL3: 25195377     # RSL3
  ML162: 609375      # ML162

# ---- DisGeNET 疾病关键词 (用于匹配 curated_gene_disease_associations) ----
diseases:
  CIRI:
    keywords:
      - cerebral ischemia
      - stroke
      - brain ischemia
      - cerebral infarction
      - ischemic stroke
    mesh_ids:
      - C091771
      - C10.228.140.300.775
  AD:
    keywords:
      - alzheimer
      - alzheimer disease
      - alzheimer's disease
    mesh_ids:
      - D000544
  Aging:
    keywords:
      - aging
      - ageing
      - senescence
      - cellular senescence
    mesh_ids:
      - D000375

