# ---- 化合物节点 (63个: 20个核心验证集 + 43个BBB/铁死亡/神经保护扩展集) ----
# 核心20个: 5本研究化合物 + 3对照 + 6柴桂剂/艾叶单体 + 6 BBB/铁死亡相关补充单体
# BBB 评估来源: _evaluate_bbb.py (RDKit descriptors + 文献经验规则 MW<=400, logP 1-4, HBD<=3, HBA<=8, TPSA<=90)
# 参考仓库: github.com/ActisDa/BBB-Permeability-Prediction, github.com/theochem/B3DB
# 扩展脚本: _expand_compounds.py (PubChem PUG-REST + RDKit, 无硬编码CID)
