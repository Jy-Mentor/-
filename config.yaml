# ============================================================
# 铁衰老分析项目 - 全局配置文件
# ============================================================
# 集中管理所有路径, 超参数, 模型配置

# ---- 路径配置 ----
paths:
  base_dir: "."
  data_dir: "L3"
  output_dir: "L3_results_phase24_lr_ciri"
  network_dir: "network_files"
  l1_results_dir: "L1/l1_results"

  # 输入文件 (实际路径, 与 module3_hgt.py 中一致)
  input_files:
    l1_genome_wide_de: "L3/L1_genome_wide_de.csv"           # 全基因组差异表达
    l1_gene_level_analysis: "L3/L1_gene_level_analysis.csv"  # 基因级分析
    celltype_express_edges: "L3/celltype_express_edges.csv"      # 细胞类型表达边
    gene_pathway_enrichment: "L3/gene_pathway_enrichment.csv"    # 基因通路富集

  # 网络文件 (实际路径, 与 module3_hgt.py 中一致)
  network_files:
    string_ppi_edges: "network_files/string_ppi_edges.csv"               # STRING PPI (小鼠)
    trrust_tf_target: "network_files/trrust_tf_target.csv"               # TRRUST v2 TF-target
    celltype_marker_genes: "network_files/celltype_marker_genes.csv"     # 细胞类型标记基因
    ligand_receptor_pairs: "network_files/ligand_receptor_pairs.csv"     # 配体-受体对
    compound_target_edges: "network_files/compound_target_edges.csv"     # 化合物-靶点
    disease_gene_associations: "network_files/disease_gene_associations.csv" # 疾病-基因关联
    gene_pathway_enrichment: "network_files/gene_pathway_enrichment.csv" # 基因通路富集(KEGG+Reactome)
    gene_coexp_edges: "network_files/gene_coexp_edges.csv"               # 基因共表达边

  # GO/KEGG/InterPro 注释文件 (来自 mygene.info API)
  annotation_files:
    go_terms: "data/go_terms.tsv"
    kegg_pathways: "data/kegg_pathways.tsv"
    interpro_domains: "data/interpro_domains.tsv"

# ---- 模型架构配置 ----
model:
  hidden_dim: 64
  gat_out_dim: 16
  hgt_out_dim: 16
  num_heads: 2
  dropout: 0.5
  gat_residual_weight: 0.3
  num_hgt_layers: 2
  encoder_type: gat_hgt  # hgt | gat | rgcn | gat_hgt
  use_vib: true
  use_self_distill: true

# ---- 训练配置 ----
training:
  epochs: 200
  learn_rate: 0.001
  weight_decay: 1e-4
  seed: 42
  eval_every: 20
  early_stop_patience: 10
  train_ratio: 0.7
  val_ratio: 0.15
  neg_sampling_ratio: 1.0
  negative_sampling: structured  # random | structured
  loss_type: ranking  # bce | ranking
  ranking_margin: 1.0

  # 学习率调度
  warmup_epochs: 10
  warmup_start_factor: 0.01

  # EMA
  ema_decay: 0.999

  # VIB
  vib_beta_max: 0.001
  vib_warmup_epochs: 50

  # DropEdge
  dropedge_p: 0.1

  # 课程学习
  curriculum:
    start_ratio: 0.5
    growth_rate: 0.02
    patience_warmup: 20
    ema_decay: 0.9

  # 负采样
  neg_sampling:
    hard_neg_ratio: 0.2
    hard_neg_refresh_interval: 40
    easy_neg_ratio: 0.8

  # 数据划分
  split_mode: stratified  # random | stratified
  split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

# ---- HeCo 预训练配置 ----
heco:
  temperature: 0.07
  projection_dim: 128
  view_mask_prob: 0.3
  pretrain_epochs_ratio: 0.167  # epochs // 6

# ---- GradNorm 配置 ----
gradnorm:
  alpha: 1.5    # ICML 2018 原文推荐: 控制恢复力强度
  lr_weight: 0.001  # 比主学习率小1-2个数量级, 确保权重平滑更新

# ---- 自蒸馏配置 ----
self_distill:
  alpha: 0.05
  temperature: 3.0

# ---- VIB 配置 ----
vib:
  beta: 0.001
  latent_dim_ratio: 0.5  # latent_dim = in_dim // 2

# ---- 可解释性配置 ----
explainability:
  target_gene: "ACSL4"
  ig_steps: 50
  n_perturb: 30
  top_k_explain: 30

# ---- L2 模块配置 (新增) ----
l2:
  # 外部 GEO 数据根目录 (可覆盖为环境变量 IRON_GEO_DIR)
  geo_dir: "D:/反向网络药理学/L1 数据集"
  # Rscript 可执行文件路径 (可覆盖为环境变量 RSCRIPT)
  rscript: "C:/R/R-4.5.2/bin/Rscript.exe"
  # 输出目录
  output_dir: "L2_results"
  l1_results_dir: "L1/l1_results"
  wgcna_input_dir: "L2_WGCNA_input"
  wgcna_output_dir: "L2_WGCNA_output"
  module2_output_dir: "module2_results"
  module2_plot_dir: "module2_plot_data"
  module3_interface_dir: "module3_interface"
  # 数据集路径 (相对于 geo_dir)
  datasets:
    GSE16561: "bulk/GSE16561"
    GSE37587: "bulk/GSE37587"
    GSE61616: "bulk/GSE61616（7d）"
    GSE97537: "bulk/GSE97537(24H)"
    GSE104036: "bulk/GSE104036（多时序）"
    GSE174574: "RNA-seq/GSE174574_RAW.tar"
  # 平台注释文件 (相对于 geo_dir 或项目根目录)
  annotations:
    GPL6883: "C:/Users/Jy-Mentor-7/Downloads/GPL6883-11606.txt"
    GPL1355: "bulk/GSE61616（7d）/GPL1355-10794 (1).txt"
  # 核心基因集 (方法学上保留, 但鼓励从 FerrDb/MSigDB 下载更新)
  gene_sets:
    isp_core: ["ACSL4", "PTGS2", "HMOX1", "TFRC", "ALOX15", "HMGB1", "TLR4", "NLRP3", "HIF1A", "KEAP1", "SOD1", "MPO", "CDO1", "DPP4", "NOX4"]
    discriminator: ["GPX4", "ACSL4", "PTGS2", "HMOX1", "TFRC", "CDKN1A", "IL6"]

# ---- 数据库配置 (v4.0) ----
database:
  # 主数据库 URL, 支持 PostgreSQL / SQLite
  # 示例: postgresql+psycopg2://user:pass@localhost:5432/iron_aging
  # 示例: sqlite:///./iron_aging.db
  url: "${IRON_DATABASE_URL:-sqlite:///./iron_aging.db}"
  echo: false
  pool_size: 10
  max_overflow: 20

# ---- 数据层配置 (Phase 2) ----
data:
  compound_features:
    # 是否对合并指纹做 PCA 降维
    use_pca: true
    # 目标主成分数 (实际会受样本量和特征数限制)
    # 63 个化合物时, n_components=10 使得样本/特征比 ≈ 6:1, 降低小样本 PCA 过拟合风险
    n_components: 10
    # 保守策略: 主成分数不超过化合物数 × 该比例, 避免小样本过拟合
    max_components_ratio: 0.25
    # 分子指纹类型与原始维度
    fp_types:
      morgan: 2048
      atompair: 2048
      maccs: 167
      rdkit: 2048

  acsl4_pocket:
    # 标准化策略: auto|raw|zscore|demean
    # auto: 多样本用 zscore, 单样本或 std≈0 用 raw
    standardization: auto
    feature_file: "network_files/acsl4_pocket_features.csv"

  ciri:
    # CIRI 差异表达基因提取参数
    de_file: "L3/L1_genome_wide_de.csv"
    min_datasets: 2
    padj_thresh: 0.05
    log2fc_thresh: 0.5
    # DE 文件缺失/无效时, 是否尝试从 disease_gene_associations.csv 中过滤 CIRI 关联作为回退
    fallback_to_disease_csv: true